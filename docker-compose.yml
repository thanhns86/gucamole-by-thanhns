services:
  # ============================================================
  # 1. PERMISSION FIX: Container này chạy quyền root để mở khóa thư mục
  # ============================================================
  fix-permission:
    image: alpine:latest
    container_name: guac_fix_perm
    user: root
    command: sh -c "mkdir -p /init && chmod -R 777 /init"
    volumes:
      - guac_db_init_shared:/init
    networks:
      - dokploy-network

  # ============================================================
  # 2. INIT DB: Chờ fix-permission xong mới chạy
  # ============================================================
  guacamole-init:
    image: guacamole/guacamole:latest
    container_name: guac_init_script
    entrypoint: /bin/sh -c "/opt/guacamole/bin/initdb.sh --postgres > /init/initdb.sql"
    volumes:
      - guac_db_init_shared:/init
    depends_on:
      fix-permission:
        condition: service_completed_successfully
    networks:
      - dokploy-network

  # ============================================================
  # 3. DATABASE: Chờ Init xong mới chạy
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres_guacamole
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_PASSWORD: 'YourSecurePassword123'
      POSTGRES_USER: guacamole_user
    volumes:
      - guac_db_init_shared:/docker-entrypoint-initdb.d:ro
      - guac_db_data:/var/lib/postgresql/data
    depends_on:
      guacamole-init:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # 4. GUACD & WEB APP
  # ============================================================
  guacd:
    image: guacamole/guacd:latest
    container_name: guacd_compose
    restart: always
    networks:
      - dokploy-network

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole_main
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd_compose
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_HOSTNAME: postgres_guacamole
      POSTGRESQL_PASSWORD: 'YourSecurePassword123'
      POSTGRESQL_USER: guacamole_user
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.guacamole.rule=Host(`remote.matbaohosting.com`)"
      - "traefik.http.routers.guacamole.entrypoints=websecure"
      - "traefik.http.routers.guacamole.tls=true"
      - "traefik.http.routers.guacamole.tls.certresolver=letsencrypt"
      - "traefik.http.services.guacamole.loadbalancer.server.port=8080"

networks:
  dokploy-network:
    external: true

volumes:
  guac_db_data:
  guac_db_init_shared:
