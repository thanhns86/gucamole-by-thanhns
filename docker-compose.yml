##############################################################
# Apache Guacamole - All-in-one Docker Compose
# Final Fix: Đã sửa lại Entrypoint Format để tránh lỗi Exit 2
##############################################################

services:

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: always
    networks:
      - dokploy-network

  guacamole-db:
    image: postgres:15
    container_name: guacamole-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guacamole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guacamole_password}
      POSTGRES_DB: ${POSTGRES_DB:-guacamole_db}
    volumes:
      - guac_db_data:/var/lib/postgresql/data
      - guac_db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guacamole} -d ${POSTGRES_DB:-guacamole_db}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - dokploy-network

  guacamole-init:
    image: guacamole/guacamole:latest
    container_name: guacamole-init
    user: root
    restart: "no"
    # SỬA TẠI ĐÂY: Chuyển sang dạng command string để tránh lỗi cú pháp shell
    entrypoint: /bin/sh -c "mkdir -p /init && if [ ! -f /init/initdb.sql ]; then /opt/guacamole/bin/initdb.sh --postgres > /init/initdb.sql; echo '[init] SQL created'; else echo '[init] Exists'; fi"
    volumes:
      - guac_db_init:/init
    networks:
      - dokploy-network

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    restart: always
    depends_on:
      guacamole-db:
        condition: service_healthy
      guacamole-init:
        condition: service_completed_successfully
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      POSTGRESQL_HOSTNAME: guacamole-db
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-guacamole_db}
      POSTGRESQL_USER: ${POSTGRES_USER:-guacamole}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-guacamole_password}
      POSTGRESQL_AUTO_CREATE_ACCOUNTS: "true"
      WEBAPP_CONTEXT: ROOT
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.guacamole-app.rule=Host(`remote.matbaohosting.com`)"
      - "traefik.http.routers.guacamole-app.entrypoints=websecure"
      - "traefik.http.routers.guacamole-app.tls=true"
      - "traefik.http.routers.guacamole-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.guacamole-app.loadbalancer.server.port=8080"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  guac_db_data:
  guac_db_init:
