services:
  # ============================================================
  # 1. INIT DB: Tự sinh file SQL ngay khi khởi động
  # ============================================================
  guacamole-init:
    image: guacamole/guacamole:1.6.0
    container_name: guac_init_script
    # Sử dụng command thay vì entrypoint để ổn định hơn trên Dokploy
    command: >
      sh -c "/opt/guacamole/bin/initdb.sh --postgres > /init/initdb.sql && 
             echo 'SUCCESS: SQL file generated' &&
             ls -l /init/initdb.sql"
    volumes:
      - guac_db_init_shared:/init
    networks:
      - dokploy-network

  # ============================================================
  # 2. DATABASE: Chờ Init xong mới chạy
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres_guacamole
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_PASSWORD: 'YourSecurePassword123'
      POSTGRES_USER: guacamole_user
    volumes:
      - guac_db_init_shared:/docker-entrypoint-initdb.d:ro
      - guac_db_data:/var/lib/postgresql/data
    depends_on:
      guacamole-init:
        condition: service_completed_successfully
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # 3. GUACD & WEB APP
  # ============================================================
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacd_compose
    restart: always
    networks:
      - dokploy-network

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: guacamole_main
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd_compose
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_HOSTNAME: postgres_guacamole
      POSTGRESQL_PASSWORD: 'YourSecurePassword123'
      POSTGRESQL_USER: guacamole_user
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.guacamole.rule=Host(`remote.matbaohosting.com`)"
      - "traefik.http.routers.guacamole.entrypoints=websecure"
      - "traefik.http.routers.guacamole.tls=true"
      - "traefik.http.routers.guacamole.tls.certresolver=letsencrypt"
      - "traefik.http.services.guacamole.loadbalancer.server.port=8080"

networks:
  dokploy-network:
    external: true

volumes:
  guac_db_data:         # Nơi lưu data thực tế của Postgres
  guac_db_init_shared:  # Volume trung gian để truyền file SQL
