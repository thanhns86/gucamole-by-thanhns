##############################################################
# Apache Guacamole - All-in-one Docker Compose
# Không cần chạy lệnh ngoài, tự động init DB hoàn toàn
# Domain: remote.matbaohosting.com
##############################################################

services:

  # ============================================================
  # 1. GUACD - Guacamole Daemon
  # ============================================================
  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: always
    networks:
      - dokploy-network

  # ============================================================
  # 2. PostgreSQL Database
  # ============================================================
  guacamole-db:
    image: postgres:15
    container_name: guacamole-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guacamole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guacamole_password}
      POSTGRES_DB: ${POSTGRES_DB:-guacamole_db}
    volumes:
      - guac_db_data:/var/lib/postgresql/data
      - guac_db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guacamole} -d ${POSTGRES_DB:-guacamole_db}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - dokploy-network

  # ============================================================
  # 3. Init container
  #    - Generate initdb.sql từ image Guacamole
  #    - Chỉ ghi vào volume nếu file chưa tồn tại (idempotent)
  # ============================================================
  guacamole-init:
    image: guacamole/guacamole:latest
    container_name: guacamole-init
    user: root
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        SQL_FILE=/init/initdb.sql
        if [ ! -f "$SQL_FILE" ]; then
          echo "[init] Generating initdb.sql ..."
          /opt/guacamole/bin/initdb.sh --postgresql > "$SQL_FILE"
          echo "[init] Done. SQL file created."
        else
          echo "[init] initdb.sql already exists, skipping."
        fi
    volumes:
      - guac_db_init:/init
    networks:
      - dokploy-network

  # ============================================================
  # 4. Guacamole Web App
  # ============================================================
  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    restart: always
    depends_on:
      guacamole-db:
        condition: service_healthy
      guacamole-init:
        condition: service_completed_successfully
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      POSTGRESQL_HOSTNAME: guacamole-db
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-guacamole_db}
      POSTGRESQL_USER: ${POSTGRES_USER:-guacamole}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-guacamole_password}
      POSTGRESQL_AUTO_CREATE_ACCOUNTS: "true"
      WEBAPP_CONTEXT: ROOT
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.guacamole-app.rule=Host(`remote.matbaohosting.com`)"
      - "traefik.http.routers.guacamole-app.entrypoints=websecure"
      - "traefik.http.routers.guacamole-app.tls=true"
      - "traefik.http.routers.guacamole-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.guacamole-app.loadbalancer.server.port=8080"
      - "traefik.http.services.guacamole-app.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.guacamole-app.loadbalancer.healthcheck.interval=30s"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  guac_db_data:
  guac_db_init:
